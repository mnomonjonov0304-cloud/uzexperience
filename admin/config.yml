backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

site_url: https://zingy-faun-42fb66.netlify.app
logo_url: /images/hero-top.jpg

collections:
  - name: "settings"
    label: "Sozlamalar"
    files:
      - name: "site"
        label: "Aloqa va integratsiyalar"
        file: "content/site.json"
        fields:
          - { label: "Telegram", name: "telegram_handle", widget: "string", default: "nizomivch" }
          - { label: "WhatsApp (998..., + siz)", name: "whatsapp_number", widget: "string", default: "998000000000" }
          - { label: "Telefon", name: "phone_number", widget: "string", default: "+998000000000" }
          - { label: "Booking form URL (Tally/Google)", name: "booking_form_url", widget: "string", required: false }
          - { label: "Telegram bot URL", name: "telegram_bot_url", widget: "string", required: false }
          - { label: "Payment link", name: "payment_link", widget: "string", required: false }
          - { label: "Review endpoint (POST JSON)", name: "review_endpoint", widget: "string", required: false }

  - name: "data"
    label: "Kontent"
    files:
      - name: "catalog"
        label: "Tajribalar, joylar va FAQ"
        file: "content/data.json"
        fields:
          - label: "Mashhur joylar"
            name: "famousPlaces"
            widget: "list"
            summary: "{{fields.region}} — {{fields.name.uz}}"
            fields:
              - { label: "Hudud (key)", name: "region", widget: "string" }
              - label: "Nomi"
                name: "name"
                widget: "object"
                fields:
                  - { label: "UZ", name: "uz", widget: "string" }
                  - { label: "RU", name: "ru", widget: "string" }
                  - { label: "EN", name: "en", widget: "string" }
              - label: "Tavsif"
                name: "desc"
                widget: "object"
                fields:
                  - { label: "UZ", name: "uz", widget: "string" }
                  - { label: "RU", name: "ru", widget: "string" }
                  - { label: "EN", name: "en", widget: "string" }
              - { label: "Rasm URL", name: "image", widget: "string" }
              - { label: "Map query", name: "mapQuery", widget: "string" }

          - label: "Tajribalar"
            name: "experiences"
            widget: "list"
            summary: "{{fields.id}} — {{fields.region}}"
            fields:
              - { label: "ID", name: "id", widget: "number", value_type: "int" }
              - { label: "Hudud (key)", name: "region", widget: "string" }
              - { label: "Kategoriya", name: "category", widget: "select", options: ["history","food","nature","craft"] }
              - { label: "Narx USD", name: "priceUSD", widget: "number", value_type: "float" }
              - { label: "Davomiylik (soat, son)", name: "durationHours", widget: "number", value_type: "float", required: false }
              - label: "Davomiylik matni"
                name: "duration"
                widget: "object"
                fields:
                  - { label: "UZ", name: "uz", widget: "string" }
                  - { label: "RU", name: "ru", widget: "string" }
                  - { label: "EN", name: "en", widget: "string" }
              - { label: "Mavjudlik", name: "availability", widget: "select", options: ["daily","weekends","request"] }
              - { label: "Reyting", name: "rating", widget: "number", value_type: "float" }
              - label: "Uchrashuv"
                name: "meeting"
                widget: "object"
                fields:
                  - { label: "UZ", name: "uz", widget: "string" }
                  - { label: "RU", name: "ru", widget: "string" }
                  - { label: "EN", name: "en", widget: "string" }
              - { label: "Map query", name: "mapQuery", widget: "string" }
              - label: "Rasmlar (URLlar)"
                name: "images"
                widget: "list"
                field: { label: "URL", widget: "string" }
              - label: "Gid"
                name: "guide"
                widget: "object"
                fields:
                  - { label: "Ism", name: "name", widget: "string" }
                  - { label: "Tillar", name: "langs", widget: "string" }
                  - label: "Tajriba"
                    name: "exp"
                    widget: "object"
                    fields:
                      - { label: "UZ", name: "uz", widget: "string" }
                      - { label: "RU", name: "ru", widget: "string" }
                      - { label: "EN", name: "en", widget: "string" }
                  - label: "Mutaxassislik"
                    name: "spec"
                    widget: "object"
                    fields:
                      - { label: "UZ", name: "uz", widget: "string" }
                      - { label: "RU", name: "ru", widget: "string" }
                      - { label: "EN", name: "en", widget: "string" }
                  - label: "Bio"
                    name: "bio"
                    widget: "object"
                    fields:
                      - { label: "UZ", name: "uz", widget: "text" }
                      - { label: "RU", name: "ru", widget: "text" }
                      - { label: "EN", name: "en", widget: "text" }
              - label: "Nomi"
                name: "title"
                widget: "object"
                fields:
                  - { label: "UZ", name: "uz", widget: "string" }
                  - { label: "RU", name: "ru", widget: "string" }
                  - { label: "EN", name: "en", widget: "string" }
              - label: "Tavsif"
                name: "desc"
                widget: "object"
                fields:
                  - { label: "UZ", name: "uz", widget: "text" }
                  - { label: "RU", name: "ru", widget: "text" }
                  - { label: "EN", name: "en", widget: "text" }
              - label: "Kiritilgan"
                name: "includes"
                widget: "object"
                fields:
                  - { label: "UZ", name: "uz", widget: "string" }
                  - { label: "RU", name: "ru", widget: "string" }
                  - { label: "EN", name: "en", widget: "string" }
              - label: "Sharhlar (statik)"
                name: "reviews"
                widget: "list"
                required: false
                fields:
                  - { label: "Ism", name: "n", widget: "string" }
                  - label: "Matn"
                    name: "t"
                    widget: "object"
                    fields:
                      - { label: "UZ", name: "uz", widget: "text" }
                      - { label: "RU", name: "ru", widget: "text" }
                      - { label: "EN", name: "en", widget: "text" }

          - label: "FAQ"
            name: "faqs"
            widget: "list"
            summary: "{{fields.q.uz}}"
            fields:
              - label: "Savol"
                name: "q"
                widget: "object"
                fields:
                  - { label: "UZ", name: "uz", widget: "string" }
                  - { label: "RU", name: "ru", widget: "string" }
                  - { label: "EN", name: "en", widget: "string" }
              - label: "Javob"
                name: "a"
                widget: "object"
                fields:
                  - { label: "UZ", name: "uz", widget: "text" }
                  - { label: "RU", name: "ru", widget: "text" }
                  - { label: "EN", name: "en", widget: "text" }
