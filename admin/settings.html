<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UzExperience Admin (Decap CMS)</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) window.netlifyIdentity.on("login", () => { document.location.href = "/admin/"; });
      });
    }
  </script>
  <p style="font-family:sans-serif;padding:1rem;color:#555">Agar Decap CMS yuklanmasa yoki sozlanmagan bo‘lsa, vaqtinchalik sozlamalar uchun <a href="/admin/settings.html">oddiy admin</a> dan foydalaning.</p>
</body>
</html>
